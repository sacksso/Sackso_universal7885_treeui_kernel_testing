name: 00_treeui_base

# Base stock: compila el kernel de TreeUI SIN modificaciones y genera una
# auditoria de bateria (dts + driver + .config) para revisar la calibracion.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig (vacio = autodetectar a7y18lte/jackpotlte)"
        required: false
        default: ""
      incluir_dtb:
        description: "Incluir dtb.img en el zip (primera prueba: SIN dtb)"
        type: boolean
        default: false
      toolchain_repo:
        description: "Repo del toolchain GCC aarch64"
        required: false
        default: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zip \
            gcc-9 g++-9 device-tree-compiler

      - name: Clonar kernel TreeUI (sin historial)
        run: |
          git clone --depth=1 -b treeui_treble \
            https://github.com/VDavid003/universal7885_treeui_kernel kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile | head -3

      - name: Clonar toolchain
        run: |
          git clone --depth=1 "${{ inputs.toolchain_repo }}" tc
          ls tc/bin | grep gcc | head -3

      - name: Elegir defconfig
        id: cfg
        run: |
          cd kernel/arch/arm64/configs
          echo "== defconfigs disponibles =="
          ls | grep -i -E '7885|a7y18|jackpot|a8|a7' || true
          DEF="${{ inputs.defconfig }}"
          if [ -z "$DEF" ]; then
            DEF=$(ls | grep -i -E 'a7y18|jackpot' | head -1 || true)
          fi
          if [ -z "$DEF" ]; then
            echo "No se autodetecto defconfig. Reejecuta indicando uno de la lista." >&2
            exit 1
          fi
          echo "Usando: $DEF"
          echo "def=$DEF" >> "$GITHUB_OUTPUT"

      - name: Compilar base stock
        run: |
          cd kernel
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export CROSS_COMPILE="$GITHUB_WORKSPACE/tc/bin/aarch64-linux-android-"
          MK="make HOSTCC=gcc-9 HOSTCXX=g++-9 KCFLAGS=-Wno-error"
          $MK "${{ steps.cfg.outputs.def }}"
          if ! $MK -j"$(nproc)" > ../build.log 2>&1; then
            echo "=== PRIMEROS ERRORES (build.log) ==="
            grep -nE 'error:|Error [0-9]+|\*\*\*|undefined reference|No such file' ../build.log | head -n 30
            echo "=== Reintento en serie para aislar el primer error ==="
            echo "=== Estado de firmware/ ==="
            ls firmware | head -n 40
            find firmware -name 'exynos7885_acpm_fvp.fw' || echo "FALTA exynos7885_acpm_fvp.fw en el arbol"
            $MK -j1 > ../build_serial.log 2>&1 || true
            grep -nE -m1 -B8 -A4 'error:|\*\*\*' ../build_serial.log || tail -n 40 ../build_serial.log
            exit 1
          fi
          ls -la arch/arm64/boot/

      - name: Clonar AnyKernel3 propio
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          token: ${{ secrets.AK3_TOKEN || github.token }}
          path: ak3

      - name: Empaquetar con AnyKernel3
        id: pack
        run: |
          set -e
          B=kernel/arch/arm64/boot
          echo "== anykernel.sh ORIGINAL de tu repo (solo para registro) =="
          grep -nE '^(kernel\.string|do\.|device\.name|BLOCK|is_slot_device|ramdisk_compression|patch_cmdline)' ak3/anykernel.sh || true
          echo "== ramdisk/ de tu repo (se VACIA en la base stock) =="
          ls -laR ak3/ramdisk || true
          echo "== tools/ =="
          ls ak3/tools || true

          VER=$(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile | awk '{print $3}' | paste -sd.)
          SHA=$(git -C kernel rev-parse --short HEAD)

          # Base stock: sin overclock (cpu_max_c1), sin parches de ramdisk de Lineage.
          # Se conservan BLOCK y device names de tu anykernel.sh.
          cat > ak3/anykernel.sh <<'EOF'
          #!/sbin/sh
          ## AnyKernel3 setup script - TreeUI base stock (a7y18lte)

          properties() { '
          kernel.string=TreeUI base stock __VER__ (a7y18lte) - sin modificaciones
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a7y18lte
          device.name2=SM-A750F
          device.name3=SM-A750FN
          device.name4=SM-A750G
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/platform/13500000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i "s/__VER__/${VER}/" ak3/anykernel.sh

          # vaciar ramdisk/ (AK3 copia su contenido encima del ramdisk de la ROM)
          find ak3/ramdisk -mindepth 1 -delete 2>/dev/null || true

          # quitar restos de otros kernels y copiar los de esta build
          rm -f ak3/Image ak3/Image.gz* ak3/zImage* ak3/dtb ak3/dtb.img ak3/*.zip
          cp "$B/Image" ak3/Image
          if [ "${{ inputs.incluir_dtb }}" = "true" ]; then
            cp "$B/dtb.img" ak3/dtb.img
            cp "$B/dtb.img" ak3/dtb
            DTB=withdtb
          else
            DTB=imageonly
          fi

          ZIP="TreeUI-a7y18lte-base-${VER}-${SHA}-${DTB}-$(date +%Y%m%d-%H%M).zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '.git/*' '.github/*' '*.md')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "== anykernel.sh generado =="
          cat ak3/anykernel.sh
          echo "== Contenido del zip =="
          unzip -l "$ZIP"

      - name: Subir zip flasheable
        uses: actions/upload-artifact@v4
        with:
          name: treeui-a7y18lte-flashable
          path: ${{ steps.pack.outputs.zip }}

      - name: Auditoria de bateria
        run: |
          mkdir -p audit
          cd kernel
          {
            echo "### defconfig: ${{ steps.cfg.outputs.def }}"
            echo "### CONFIG de bateria/cargador/fuel gauge"
            grep -iE 'BATTERY|FUELGAUGE|FUEL_GAUGE|CHARGER|MFC|MAX77|S2M|SM5' .config | grep -v '^#' || true
          } > ../audit/config_bateria.txt

          {
            echo "### Archivos del driver de bateria"
            ls -la drivers/battery_v2 drivers/battery 2>/dev/null || true
          } > ../audit/driver_archivos.txt

          {
            echo "### Fuentes DTS/DTSI del dispositivo"
            find arch/arm64/boot/dts -type f \( -name '*.dts' -o -name '*.dtsi' \) \
              \( -iname '*a7y18*' -o -iname '*jackpot*' -o -iname '*battery*' -o -iname '*fuelgauge*' \) | sort
            echo
            echo "### Valores de capacidad / fuelgauge / battery en esas fuentes"
            for f in $(find arch/arm64/boot/dts -type f \( -name '*.dts' -o -name '*.dtsi' \) \
              \( -iname '*a7y18*' -o -iname '*jackpot*' -o -iname '*battery*' -o -iname '*fuelgauge*' \) | sort); do
              echo "--- $f"
              grep -naE 'capacity|fuelgauge,|battery,(full|chg|swelling|temp|vfloat|input|normal)|battery_data|cycle' "$f" || true
            done
          } > ../audit/dts_bateria.txt

          {
            echo "### Referencias a capacidad en el driver"
            grep -rnE 'capacity_max|capacity_min|capacity_calculation|batt_full_capacity|full_capacity|design' \
              drivers/battery_v2 2>/dev/null | head -n 150 || true
          } > ../audit/driver_capacidad.txt

          head -n 80 ../audit/dts_bateria.txt || true

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treeui-base-stock
          path: |
            kernel/arch/arm64/boot/Image*
            kernel/arch/arm64/boot/dtb.img
            kernel/arch/arm64/boot/dts/exynos/*.dtb
            kernel/.config
            build.log
            build_serial.log
            audit/
