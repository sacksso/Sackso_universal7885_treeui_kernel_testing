name: 04_treeui_selinux_inspect

# Solo lectura: no compila. Muestra por que el kernel TreeUI queda en permissive
# aunque el cmdline diga enforcing y setenforce 1 no surta efecto.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar TreeUI
        run: |
          git clone --depth=1 -b treeui_treble https://github.com/VDavid003/universal7885_treeui_kernel kernel
          git -C kernel log -1 --format='commit %h %s'

      - name: Buscar el forzado de permissive
        run: |
          cd kernel
          {
          echo "=== 1) NEVER_ENFORCE / ALWAYS_ENFORCE / FAKE_ENFORCE en TODO el arbol ==="
          grep -rnE 'NEVER_ENFORCE|ALWAYS_ENFORCE|FAKE_ENFORCE|CONFIG_SECURITY_SELINUX_PERMISSIVE' --include='*' . 2>/dev/null | grep -v '^./Documentation' | head -60
          echo; echo "=== 2) definicion en Kconfig ==="
          grep -n -B2 -A12 'NEVER_ENFORCE' security/selinux/Kconfig security/Kconfig 2>/dev/null | head -60
          echo; echo "=== 3) hooks.c: enforcing_setup y selinux_enforcing ==="
          grep -nE 'selinux_enforcing|enforcing_setup|selinux_enabled' security/selinux/hooks.c | head -40
          echo "--- enforcing_setup ---"
          sed -n '/enforcing_setup/,/^__setup/p' security/selinux/hooks.c | head -40
          echo; echo "=== 4) selinuxfs.c: sel_write_enforce completo ==="
          sed -n '/^static ssize_t sel_write_enforce/,/^}/p' security/selinux/selinuxfs.c
          echo; echo "=== 5) asignaciones a selinux_enforcing en todo security/ ==="
          grep -rnE 'selinux_enforcing[[:space:]]*=' security/ | head -30
          echo; echo "=== 6) Samsung/RKP/Knox que puedan forzar (SEC, PROCA, FIVE, DEFEX, KNOX, RKP) ==="
          grep -rnE 'selinux_enforcing|enforcing' security/selinux/*.c | grep -iE 'sec_|knox|rkp|force|permissive' | head -20
          echo; echo "=== 7) defconfig del arbol: lineas de SELinux ==="
          grep -n 'SELINUX' arch/arm64/configs/exynos7885-a7y18lte_defconfig
          echo; echo "=== 8) git diff de este arbol respecto a upstream? (ultimos commits que tocaron selinux) ==="
          git log --oneline -5 -- security/selinux 2>/dev/null || true
          } 2>&1 | tee ../selinux_inspect.txt
          echo "## Inspeccion SELinux" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 ../selinux_inspect.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Resolver .config y ver SELinux
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev gcc-9 >/dev/null
          cd kernel
          make ARCH=arm64 HOSTCC=gcc-9 exynos7885-a7y18lte_defconfig >/dev/null
          grep -n 'SELINUX' .config | tee ../selinux_config_resolved.txt

      - uses: actions/upload-artifact@v4
        with:
          name: selinux-inspect
          path: |
            selinux_inspect.txt
            selinux_config_resolved.txt
